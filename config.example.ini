; every path below may be absolute or relative; relative paths resolve against this project's directory
[paths]
; root directory of your local media library
media_dir = D:
db_path = myMovieDB.db
covers_dir = covers
covers_small_dir = covers_small
; path to the MediaInfo CLI executable
mediainfo_path = tools\MediaInfo_CLI\MediaInfo.exe
; path to the ffmpeg executable (used for cropping/aspect-ratio detection -- see ScrapeCropping)
ffmpeg_path = tools\ffmpeg.exe
; persistent Chrome profile directory (cookies/session state), reused across runs so IMDb sees a
; returning browser instead of a brand-new one every time -- created automatically if missing
chrome_profile_dir = chrome_profile
; path to the IMDb offline dataset helper DB (built by --update from IMDb's downloadable dataset
; files -- title.basics, title.ratings, title.episode, name.basics -- then indexed for fast lookup;
; the raw files themselves are only ever kept in a temporary directory during the build, never
; persisted alongside this)
imdb_helper_db_path = imdb_offline.db
; one imdb id (e.g. tt1234567) per line. Titles not deemed worth cataloguing at all (e.g. an
; amateur/fan production) -- must never appear in the DB in any form: if referenced by other media
; they're silently skipped, if found locally-owned the sync errors out
ignored_ids_path = ignored.txt
; one imdb id per line. Titles whose existence is honored (fine to have in the DB) but that aren't
; worth the effort of adding locally -- mainly used to keep a to-be-added list generated from the DB
; free of entries not worth adding. For a movie or an individual episode's own id, the sync errors
; out if it's found locally-owned. For a series id specifically, this instead just means "no more
; episodes of this series are planned to be added": an already- or newly-owned episode is fine, and
; the rest still get catalogued as referenced-only stubs like any other partially-owned series.
wontadd_ids_path = wontadd.txt
; one imdb interest id (e.g. in0000090) per line. Subgenres on this list are still scraped and
; stored normally, but never shown/selectable in the server UI (read once at server start).
hidden_interest_ids_path = hidden_interests.txt

[scraping]
; delay in seconds between IMDb requests
delay = 5
; max number of titles to scrape online per run; a series counts as a single title regardless of
; how many episodes it has, so its episodes are never split across separate sync runs
max_count = 50
; run Chrome headless. Leave false until IMDb's human-verification challenge page has actually been
; identified and __isHumanVerificationPage taught to recognize it -- until then a headless run can't
; detect or react to the challenge if it appears, so it would just silently fail later on
headless = false
; seconds to wait after each page navigation for it to render before scraping its DOM
page_load_wait = 4

[backup]
; whether -s/-r automatically create a backup once the last one is old enough; -b always creates
; one on demand regardless of this setting
auto_backup = true
; directory to store DB backups in (relative paths resolve against this project's directory)
backup_dir = backup
; minimum age, in days, the newest backup must reach before -s/-r creates a new one automatically
; (see DBBackup.ensureBackup) -- -b/--backup creates one immediately regardless of age
backup_frequency_days = 14
; maximum number of backup files to keep; the oldest is deleted once a new backup would exceed this
backup_max_count = 10

[helper_db]
; whether -s/-r automatically rebuild the IMDb offline dataset helper DB when it's missing or too
; old; -u always rebuilds on demand regardless of this setting
auto_update = true
; minimum age, in days, before an existing helper DB is considered due for an automatic rebuild
; (a missing helper DB is always due, regardless of this setting, as long as auto_update is on)
update_frequency_days = 30
; whether any update -- automatic or manual -u -- is immediately followed by a full refresh
; (equivalent to -r) of all known media against the freshly-updated data. Off by default: unlike
; the update itself, a refresh walks every known medium (cost scales with your whole library, not
; with what changed) and can itself fail loud on a genuine data inconsistency (e.g. a locally-owned
; episode vanishing from IMDb's dataset), so it's worth opting into deliberately rather than having
; it silently piggyback on a routine sync
auto_refresh = false

[media_update]
; whether -s automatically detects locally-owned media whose file(s) changed (newer mtime than
; what's stored -- e.g. after replacing a file with a new remux/remaster), and re-scrapes them from
; scratch (full remove + re-add, sharing the same per-run scrape budget as brand-new titles -- see
; [scraping]'s max_count). Off by default: mtime is a heuristic, not a guarantee (a copy/restore
; could bump it without real content changing)
auto_update_media = false

[cropping]
; number of frames each cropdetect burst analyzes
burst_frame_count = 200
; runtime percentages (comma-separated) to sample bursts at -- see ScrapeCropping.detectCropping
runtime_percentages = 5,10,15,20,25,30,40,50,60,70,80,85,90
; max per-dimension pixel difference for two bursts' readings to count as "the same" cropping --
; used both to cluster bursts together and as the noise floor for the checks below
cluster_tolerance = 3
; max pixel difference between the accepted result's top/bottom (or left/right) pair to still
; count as symmetric -- real letterboxing/pillarboxing is essentially always symmetric, so a result
; that isn't needs a human to confirm it's genuine rather than a detection error
symmetry_tolerance = 4
; minimum number of mutually-agreeing bursts for a non-accepted cropping reading to count as a
; real, repeated alternate aspect ratio rather than a one-off detection glitch
minimum_cluster_size = 2
; a bar bigger than this (on either axis) counts as "meaningful" rather than noise-level for the
; windowboxing check -- the accepted result is rejected if it has meaningful bars on both axes at
; once (real letterboxing and pillarboxing simultaneously is unusual enough to want a human to
; confirm it's genuine, e.g. not an accidental encode)
windowboxing_tolerance = 8

[output]
; how much console output -s/-r/-u produce -- see verbosity.py for exactly what each level adds
; 0: warnings and top-level status only (which step is currently running)
; 1: + everything else currently printed, except individual person additions
; 2: + individual "new person added" lines -- the full output this project has always produced
verbosity = 1

[server]
host = 0.0.0.0
port = 5000

; abbreviation = full name, one per line. Used to seed source_web_provider_enum on every sync
; (see DBControl.syncWebProvidersFromConfig) -- the enum itself is the source of truth once
; seeded, so removing an entry here only stops it being re-affirmed, it doesn't retract it.
[web_providers]
AMZN = Amazon
MA = Movies Anywhere
