; every path below may be absolute or relative; relative paths resolve against this project's directory
[paths]
; root directory of your local media library
media_dir = D:
db_path = myMovieDB.db
covers_dir = covers
covers_small_dir = covers_small
; path to the selenium chromedriver executable
webdriver_path = tools\chromedriver-win32\chromedriver.exe
; persistent Chrome profile directory (cookies/session state), reused across runs so IMDb sees a
; returning browser instead of a brand-new one every time -- created automatically if missing
chrome_profile_dir = chrome_profile
; directory containing the downloaded IMDb offline datasets (title.basics, title.ratings, ...)
imdb_datasets_dir = imdb_datasets
; one imdb id (e.g. tt1234567) per line. Ids on this list must never appear in the DB at all: if
; referenced by other media they're silently skipped, if found locally-owned the sync errors out
ignored_ids_path = ignored.txt
; one imdb id per line. Ids on this list may reside in the DB as referenced-only media, but are
; never meant to be added as local media -- the sync errors out if one is found locally-owned
wontadd_ids_path = wontadd.txt
; one imdb interest id (e.g. in0000090) per line. Subgenres on this list are still scraped and
; stored normally, but never shown/selectable in the server UI (read once at server start).
hidden_interest_ids_path = hidden_interests.txt

[scraping]
; delay in seconds between IMDb requests
delay = 5
; max number of titles to scrape online per run; a series counts as a single title regardless of
; how many episodes it has, so its episodes are never split across separate sync runs
max_count = 50
; run Chrome headless. Leave false until IMDb's human-verification challenge page has actually been
; identified and __isHumanVerificationPage taught to recognize it -- until then a headless run can't
; detect or react to the challenge if it appears, so it would just silently fail later on
headless = false
; seconds to wait after each page navigation for it to render before scraping its DOM
page_load_wait = 4

[server]
host = 0.0.0.0
port = 5000

; abbreviation = full name, one per line. Used to seed source_web_provider_enum on every sync
; (see DBControl.syncWebProvidersFromConfig) -- the enum itself is the source of truth once
; seeded, so removing an entry here only stops it being re-affirmed, it doesn't retract it.
[web_providers]
AMZN = Amazon
MA = Movies Anywhere
