; config.ini used INSIDE the docker image (see Dockerfile). config.py insists on a complete config
; file, but the web UI (server.py) only ever reads db_path, covers_dir, covers_small_dir,
; hidden_interest_ids_path and the [server] section -- every other value below is a placeholder
; that merely has to exist and parse. The data paths point at /data, where compose.yaml mounts the
; host's data directory (read-only).

[paths]
media_dir = /unused
db_path = /data/myMovieDB.db
covers_dir = /data/covers
covers_small_dir = /data/covers_small
mediainfo_path = /unused
ffmpeg_path = /unused
chrome_profile_dir = /unused
imdb_helper_db_path = /unused
ignored_ids_path = /unused
wontadd_ids_path = /unused
hidden_interest_ids_path = /data/hidden_interests.txt

[local_scan]
ignored_file_patterns = *.nfo

[scraping]
delay = 5
max_count = 50
recover_missing_covers = true
headless = false
page_load_wait = 4

[backup]
auto_backup = false
backup_dir = /unused
backup_frequency_days = 14
backup_max_count = 10

[helper_db]
auto_update = false
update_frequency_days = 30
auto_refresh = false

[media_update]
auto_update_media = false

[cropping]
burst_frame_count = 200
runtime_percentages = 5,10,15,20,25,30,40,50,60,70,80,85,90
cluster_tolerance = 3
symmetry_tolerance = 4
minimum_cluster_size = 2
windowboxing_tolerance = 8
minimum_deviation = 20

[output]
verbosity = 1

[server]
; 0.0.0.0: reachable from outside the container (compose.yaml publishes it; the reverse proxy does
; the HTTPS). Port and curtain settings as in the author's own config.ini.
host = 0.0.0.0
port = 5000
curtain_animation = true
curtain_style = classic

[web_providers]
