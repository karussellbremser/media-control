; config.ini used INSIDE the docker image (see Dockerfile). The web UI only needs the data paths and
; the [server] section (see serverconfig.py); the data paths point at /data, where compose.yaml
; mounts the host's data directory (read-only).

[paths]
db_path = /data/myMovieDB.db
covers_dir = /data/covers
covers_small_dir = /data/covers_small
hidden_interest_ids_path = /data/hidden_interests.txt

[server]
; 0.0.0.0: reachable from outside the container. The port is what gunicorn.conf.py binds; the
; mapping in compose.yaml ("<host port>:<this port>") has to name the same one. HTTPS is done by
; the reverse proxy in front.
host = 0.0.0.0
port = 5000
; the author's own settings
curtain_animation = true
curtain_style = classic
; the web UI refuses to start if this file is missing or malformed, so it can never be exposed
; without its login -- see README.md ("Hosting the web UI with Docker"); compose.yaml mounts it
auth_file = /run/auth.txt
