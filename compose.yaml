# Web UI for the library, for a server running (rootless) Docker behind a reverse proxy that
# forwards https://<your hostname> to a host port and handles HTTPS. See README.md ("Hosting the
# web UI with Docker") for the deployment steps.
#
# Next to this file on the server:
#   data/      the database (myMovieDB.db), covers/, covers_small/ and hidden_interests.txt
#   auth.txt   the web UI's login, one line "username:password-hash" (see README) -- the image's
#              config makes it mandatory: the UI refuses to start without it, so it can never be
#              exposed unprotected by accident
#   .env       required: sets HOST_PORT, the host port your reverse proxy forwards to (see .env.example)
services:
  media-control:
    build: .
    image: media-control
    container_name: media-control
    restart: unless-stopped
    ports:
      # <host port the proxy forwards to, from .env -- required, no default>:<the [server] port of
      # docker/config.docker.ini>
      - "${HOST_PORT:?set HOST_PORT in a .env file next to compose.yaml (see .env.example)}:5000"
    volumes:
      # the whole directory, not single files: replacing the database by renaming a new file over it
      # (see README) would otherwise leave the container looking at the old file
      - ./data:/data:ro
      - ./auth.txt:/run/auth.txt:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
