; connection settings for deploy.py -- copy to deploy.ini (not tracked by git) and fill in
[server]
host = your.server.example
user = yourname
; ssh port, if not the standard 22
; port = 22
; ssh key, if not the default one
; identity_file = ~/.ssh/id_ed25519
; the project directory on the server (relative to your home there, or absolute): the clone that
; holds compose.yaml, data/ and auth.txt
remote_dir = media-control
; the host port compose.yaml publishes (HOST_PORT), used to check that the app answers after a deploy
host_port = 6767
; the branch the server follows (code/full refuse to deploy anything that isn't its pushed tip)
; branch = main
; run before every command on the server, if docker only works after some setup in a non-interactive
; shell -- e.g. for rootless docker: export DOCKER_HOST=unix:///run/user/1000/docker.sock
; remote_prefix =

; paths on THIS machine; by default they come from config.ini (db_path, covers_dir, covers_small_dir,
; hidden_interest_ids_path)
; [local]
; db_path =
; covers_dir =
; covers_small_dir =
; hidden_interest_ids_path =
